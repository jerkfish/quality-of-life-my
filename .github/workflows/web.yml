name: web

# Builds the static site from the committed data artifacts and checks quality gates.
#
# This workflow does NOT fetch upstream data. If the pipeline workflow has just committed
# refreshed artifacts, this one builds against them — so a broken artifact surfaces as a
# failed build rather than as a wrong number on a live site.

on:
  push:
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Fails loudly if an artifact is missing or a page references data the pipeline no
      # longer emits. `data.ts` throws at import time for exactly this reason.
      - name: Type check
        working-directory: web
        run: bun x astro check

      - name: Build
        working-directory: web
        run: bun x astro build

      - name: Check every chart's data is present in the built HTML
        working-directory: web
        run: |
          # Charts render client-side, so the built HTML cannot prove they draw. What it CAN
          # prove is that every chart island received a non-empty props object — an empty one
          # renders a blank rectangle that looks like "no data".
          fail=0
          for f in $(find dist -name '*.html'); do
            empties=$(grep -o 'data-props="{}"' "$f" | wc -l)
            if [ "$empties" -gt 0 ]; then
              echo "::error file=$f::$empties chart(s) received empty props"
              fail=1
            fi
          done
          exit $fail

      # Performance and accessibility gates. The brief asks for Lighthouse >= 90; we hold the
      # same bar in CI so a regression cannot merge quietly.
      - name: Lighthouse (three runs)
        working-directory: web
        run: |
          set -euo pipefail
          bun x astro preview --port 4321 > preview.log 2>&1 &
          PREVIEW_PID=$!
          echo "preview pid $PREVIEW_PID"

          # Wait for the server to actually answer, rather than guessing with `sleep`.
          #
          # The first version slept 5 seconds and then ran Lighthouse. On a cold runner that
          # is not always enough, Lighthouse could not connect, wrote no report, and the next
          # step died on a missing file — which surfaced only as "Process completed with exit
          # code 1" with no useful message. Poll until it is up, then give up loudly.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 2 http://localhost:4321/; then
              echo "server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::astro preview did not become ready within 60s"
              cat preview.log
              exit 1
            fi
            sleep 1
          done

          # Three runs, median taken.
          #
          # A single Lighthouse performance score on a shared CI runner is noisy enough to
          # swing by several points. A gate that fails on one unlucky sample reports the
          # runner's mood, not the site's quality. Three runs still fail on a real regression
          # (all three would drop) while ignoring a single slow moment.
          #
          # The version is pinned exactly: an unpinned `bun x lighthouse` changes scoring
          # behaviour between runs and makes a threshold failure impossible to reproduce.
          ok=0
          for run in 1 2 3; do
            if bun x lighthouse@13.6.0 http://localhost:4321/ \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --output=json --output-path="./lhr-run-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo; then
              ok=$((ok + 1))
            else
              echo "::warning::Lighthouse run ${run} failed"
            fi
          done

          kill "$PREVIEW_PID" 2>/dev/null || true

          if [ "$ok" -lt 2 ]; then
            echo "::error::only ${ok}/3 Lighthouse runs produced a report"
            cat preview.log
            exit 1
          fi
          ls -l lhr-run-*.json

      - name: Enforce Lighthouse thresholds
        working-directory: web
        run: |
          python3 - <<'PY'
          import glob, json, statistics, sys

          paths = sorted(glob.glob("lhr-run-*.json"))
          if len(paths) < 2:
              # Explicit, because the previous version surfaced this as a bare exit code 1.
              print(f"::error::expected at least 2 Lighthouse reports, found {len(paths)}")
              sys.exit(1)

          reports = [json.load(open(p, encoding="utf-8")) for p in paths]
          thresholds = {"performance": 90, "accessibility": 95, "best-practices": 90, "seo": 90}

          rows = ["| category | median | runs | required |", "|---|---|---|---|"]
          failed = False
          for name, floor in thresholds.items():
              values = []
              for report in reports:
                  score = report["categories"][name]["score"]
                  if score is not None:
                      values.append(round(score * 100))
              if not values:
                  rows.append(f"| {name} | — | — | {floor} | **FAIL** (no score) |")
                  failed = True
                  continue
              got = int(statistics.median(values))
              ok = got >= floor
              failed = failed or not ok
              runs = ", ".join(str(v) for v in values)
              rows.append(f"| {name} | {got} | {runs} | {floor} |{' **FAIL**' if not ok else ''} |")

          table = "\n".join(rows)
          print(table)
          with open("lighthouse.md", "w", encoding="utf-8") as fh:
              fh.write(table + "\n")

          # The step summary is the only place a failure like this is readable without
          # admin access to the job log.
          with open("lighthouse_summary.txt", "w", encoding="utf-8") as fh:
              fh.write(table)
              fh.write("\n\n" + ("**One or more categories are below the required score.**"
                                 if failed else "All categories pass (median of three runs)."))

          sys.exit(1 if failed else 0)
          PY

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            web/lhr-run-*.json
            web/lighthouse.md
            web/lighthouse_summary.txt
            web/preview.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "### Web build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f web/lighthouse_summary.txt ]; then
            cat web/lighthouse_summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Lighthouse did not produce a summary — see the uploaded report artifact._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          du -sh web/dist 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
